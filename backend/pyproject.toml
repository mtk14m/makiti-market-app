[project]
name = "makiti-platform-backend"
version = "0.1.0"
description = "Backend API for Makiti C2C marketplace and smart-box logistics"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [
  { name = "Makiti Platform Team" },
]
dependencies = [
  "fastapi>=0.109.0,<0.110.0",
  "uvicorn[standard]>=0.27.0,<0.28.0",
  "pydantic[email]>=2.5.3,<3.0.0",
  "pydantic-settings>=2.1.0,<3.0.0",
  "sqlalchemy>=2.0.25,<3.0.0",
  "alembic>=1.13.1,<2.0.0",
  "psycopg2-binary>=2.9.9,<3.0.0",
  "asyncpg>=0.29.0,<0.30.0",
  "redis>=5.0.1,<6.0.0",
  "aioredis>=2.0.1,<3.0.0",
  "rq>=1.15.1,<2.0.0",
  "python-jose[cryptography]>=3.3.0,<4.0.0",
  "passlib[bcrypt]>=1.7.4,<2.0.0",
  "python-multipart>=0.0.6,<0.0.7",
  "email-validator>=2.1.0,<3.0.0",
  "python-dotenv>=1.0.0,<2.0.0",
  "httpx>=0.26.0,<0.27.0",
  "structlog>=24.1.0,<25.0.0",
  "prometheus-client>=0.19.0,<0.20.0",
  "sentry-sdk[fastapi]>=2.4.0,<3.0.0",
  "minio>=7.2.0,<8.0.0",
  "pillow>=10.2.0,<11.0.0",
  "greenlet>=3.0.0,<4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "black>=24.2.0,<25.0.0",
  "mypy>=1.8.0,<2.0.0",
  "ruff>=0.2.1,<0.3.0",
  "pytest>=8.0.2,<9.0.0",
  "pytest-asyncio>=0.23.3,<0.24.0",
  "pytest-cov>=4.1.0,<5.0.0",
  "faker>=22.0.0,<23.0.0",
  "pre-commit>=3.6.0,<4.0.0",
]
test = [
  "pytest>=8.0.2,<9.0.0",
  "pytest-asyncio>=0.23.3,<0.24.0",
  "pytest-cov>=4.1.0,<5.0.0",
  "pytest-mock>=3.12.0,<4.0.0",
  "httpx>=0.26.0,<0.27.0",
  "faker>=22.0.0,<23.0.0",
  "aiosqlite>=0.19.0,<0.20.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | migrations
)/
'''

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "alembic.*",
    "redis.*",
    "aioredis.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "ARG",
    "SIM",
    "TCH",
    "PTH",
    "ERA",
    "PD",
    "PL",
    "TRY",
    "RUF",
]
ignore = [
    "E501",
    "B008",
    "PLR0913",
    "PLR2004",
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["ARG", "PLR2004"]

[tool.ruff.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=app --cov-report=term-missing --cov-report=html"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
