name: makiti_market
description: Application mobile Makiti - Plateforme premium de courses de marché pour l'Afrique de l'Ouest
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  
  # Navigation
  go_router: ^12.1.3
  
  # UI
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  phosphor_flutter: ^2.1.0
  image_picker: ^1.1.2
  google_fonts: ^6.2.1
  
  # Utils
  intl: ^0.20.2
  uuid: ^4.1.0
  flutter_localizations:
    sdk: flutter
  
  # HTTP
  http: ^1.1.0
  
  # Cache Management
  flutter_cache_manager: ^3.3.1
  
  # Storage
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
